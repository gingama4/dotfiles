name: macOS

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Test macOS setup
        run: ./scripts/test_macos.sh
